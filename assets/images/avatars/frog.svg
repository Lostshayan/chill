<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Background Circle: Soft Rain Celadon -->
  <circle cx="50" cy="50" r="48" fill="#E8F5E9" stroke="#A5D6A7" stroke-width="2"/>
  
  <!-- Lotus Leaf Hat / Umbrella -->
  <path d="M26 30 Q50 18 74 30 Q50 36 26 30 Z" fill="#4CAF50" stroke="#2E7D32" stroke-width="1.5"/>
  <line x1="50" y1="23" x2="50" y2="15" stroke="#2E7D32" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Frog Eyeballs Bump -->
  <circle cx="34" cy="38" r="9" fill="#81C784"/>
  <circle cx="66" cy="38" r="9" fill="#81C784"/>
  
  <!-- Big Eyes -->
  <circle cx="34" cy="38" r="5" fill="#1B5E20"/>
  <circle cx="36" cy="36" r="2" fill="#FFFFFF"/>
  <circle cx="66" cy="38" r="5" fill="#1B5E20"/>
  <circle cx="64" cy="36" r="2" fill="#FFFFFF"/>
  
  <!-- Frog Head/Body -->
  <ellipse cx="50" cy="55" rx="28" ry="22" fill="#81C784"/>
  
  <!-- Cream Belly -->
  <ellipse cx="50" cy="62" rx="16" ry="12" fill="#E8F5E9"/>
  
  <!-- Sweet Smile -->
  <path d="M42 56 Q50 63 58 56" fill="none" stroke="#2E7D32" stroke-width="2.2" stroke-linecap="round"/>
  
  <!-- Blush Cheeks -->
  <ellipse cx="30" cy="56" rx="4.5" ry="2.6" fill="#FFAAA6" opacity="0.6"/>
  <ellipse cx="70" cy="56" rx="4.5" ry="2.6" fill="#FFAAA6" opacity="0.6"/>
  
  <!-- Tiny Raindrop -->
  <path d="M68 20 C68 20 72 26 72 28 C72 30 70 32 68 32 C66 32 64 30 64 28 C64 26 68 20 68 20 Z" fill="#81D4FA" opacity="0.75"/>
</svg>
