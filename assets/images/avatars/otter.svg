<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Background Circle: Soft Lagoon Aqua -->
  <circle cx="50" cy="50" r="48" fill="#E0F2F1" stroke="#80CBC4" stroke-width="2"/>
  
  <!-- Tiny Otter Ears -->
  <circle cx="28" cy="34" r="6" fill="#8D6E63"/>
  <circle cx="28" cy="34" r="3" fill="#D7CCC8"/>
  <circle cx="72" cy="34" r="6" fill="#8D6E63"/>
  <circle cx="72" cy="34" r="3" fill="#D7CCC8"/>
  
  <!-- Otter Head (Rounded pear shape) -->
  <ellipse cx="50" cy="52" rx="27" ry="24" fill="#8D6E63"/>
  
  <!-- Creamy Snout & Cheeks -->
  <ellipse cx="50" cy="59" rx="16" ry="11" fill="#F5EBE6"/>
  
  <!-- Big Shiny Nose -->
  <polygon points="50,56 46,52 54,52" fill="#3E2723"/>
  <path d="M47 57 Q50 60 50 58 Q50 60 53 57" fill="none" stroke="#3E2723" stroke-width="1.6" stroke-linecap="round"/>
  
  <!-- Whiskers -->
  <line x1="33" y1="57" x2="43" y2="57" stroke="#8D6E63" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="34" y1="60" x2="43" y2="59" stroke="#8D6E63" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="57" y1="57" x2="67" y2="57" stroke="#8D6E63" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="57" y1="59" x2="66" y2="60" stroke="#8D6E63" stroke-width="1.2" stroke-linecap="round"/>
  
  <!-- Eyes -->
  <circle cx="41" cy="48" r="3.2" fill="#2E1C14"/>
  <circle cx="42" cy="47" r="1.2" fill="#FFFFFF"/>
  <circle cx="59" cy="48" r="3.2" fill="#2E1C14"/>
  <circle cx="60" cy="47" r="1.2" fill="#FFFFFF"/>
  
  <!-- Blush Cheeks -->
  <ellipse cx="32" cy="54" rx="4.5" ry="2.6" fill="#FFAAA6" opacity="0.6"/>
  <ellipse cx="68" cy="54" rx="4.5" ry="2.6" fill="#FFAAA6" opacity="0.6"/>
  
  <!-- Cute paws holding a shell -->
  <ellipse cx="44" cy="74" rx="4.5" ry="5.5" fill="#6D4C41"/>
  <ellipse cx="56" cy="74" rx="4.5" ry="5.5" fill="#6D4C41"/>
  <path d="M47 72 Q50 68 53 72 Q50 76 47 72 Z" fill="#FFE082" stroke="#FFB300" stroke-width="0.8"/>
</svg>
