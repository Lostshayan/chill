<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Background Circle: Warm Honey Linen -->
  <circle cx="50" cy="50" r="48" fill="#F4E8C1" stroke="#E0C688" stroke-width="2"/>
  
  <!-- Bear Ears -->
  <circle cx="28" cy="27" r="10" fill="#9C6644"/>
  <circle cx="28" cy="27" r="5" fill="#DDB892"/>
  <circle cx="72" cy="27" r="10" fill="#9C6644"/>
  <circle cx="72" cy="27" r="5" fill="#DDB892"/>
  
  <!-- Bear Head -->
  <ellipse cx="50" cy="52" rx="29" ry="26" fill="#9C6644"/>
  
  <!-- Snout / Muzzle -->
  <ellipse cx="50" cy="58" rx="13" ry="10" fill="#DDB892"/>
  <ellipse cx="50" cy="54" rx="4" ry="2.6" fill="#432818"/>
  <path d="M48 57 Q50 60 50 58 Q50 60 52 57" fill="none" stroke="#432818" stroke-width="1.6" stroke-linecap="round"/>
  
  <!-- Tortoiseshell Study Glasses -->
  <!-- Left lens -->
  <circle cx="39" cy="48" r="9" fill="none" stroke="#432818" stroke-width="2.6"/>
  <!-- Right lens -->
  <circle cx="61" cy="48" r="9" fill="none" stroke="#432818" stroke-width="2.6"/>
  <!-- Bridge -->
  <path d="M48 48 Q50 45 52 48" fill="none" stroke="#432818" stroke-width="2.6" stroke-linecap="round"/>
  
  <!-- Eyes inside glasses -->
  <circle cx="39" cy="48" r="2.8" fill="#2B2118"/>
  <circle cx="40" cy="47" r="1" fill="#FFFFFF"/>
  <circle cx="61" cy="48" r="2.8" fill="#2B2118"/>
  <circle cx="62" cy="47" r="1" fill="#FFFFFF"/>
  
  <!-- Blush Cheeks -->
  <ellipse cx="27" cy="56" rx="4.5" ry="2.5" fill="#FFAAA6" opacity="0.6"/>
  <ellipse cx="73" cy="56" rx="4.5" ry="2.5" fill="#FFAAA6" opacity="0.6"/>
</svg>
