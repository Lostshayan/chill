<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Background Circle: Warm Peach Sand -->
  <circle cx="50" cy="50" r="48" fill="#FCEADE" stroke="#E9C49A" stroke-width="2"/>
  
  <!-- Cat Ears -->
  <path d="M26 36 L18 18 L38 24 Z" fill="#FFF5ED" stroke="#D4A373" stroke-width="2" stroke-linejoin="round"/>
  <path d="M25 32 L20 20 L34 24 Z" fill="#F8B4A5"/>
  <path d="M74 36 L82 18 L62 24 Z" fill="#FFF5ED" stroke="#D4A373" stroke-width="2" stroke-linejoin="round"/>
  <path d="M75 32 L80 20 L66 24 Z" fill="#F8B4A5"/>
  
  <!-- Cat Head -->
  <ellipse cx="50" cy="52" rx="28" ry="24" fill="#FFF8F2"/>
  
  <!-- Headphone Band -->
  <path d="M20 50 A30 30 0 0 1 80 50" fill="none" stroke="#D4A373" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Headphone Ear Pads -->
  <rect x="15" y="44" width="9" height="15" rx="4.5" fill="#8B5E3C"/>
  <rect x="76" y="44" width="9" height="15" rx="4.5" fill="#8B5E3C"/>
  
  <!-- Eyes -->
  <ellipse cx="40" cy="50" rx="3.5" ry="4.5" fill="#2B2118"/>
  <circle cx="41.5" cy="48.5" r="1.3" fill="#FFFFFF"/>
  <ellipse cx="60" cy="50" rx="3.5" ry="4.5" fill="#2B2118"/>
  <circle cx="61.5" cy="48.5" r="1.3" fill="#FFFFFF"/>
  
  <!-- Nose & Mouth -->
  <polygon points="50,56 48,54 52,54" fill="#E2847A"/>
  <path d="M47 57 Q50 60 50 58 Q50 60 53 57" fill="none" stroke="#2B2118" stroke-width="1.6" stroke-linecap="round"/>
  
  <!-- Blush Cheeks -->
  <ellipse cx="32" cy="56" rx="4.5" ry="2.5" fill="#FFAAA6" opacity="0.6"/>
  <ellipse cx="68" cy="56" rx="4.5" ry="2.5" fill="#FFAAA6" opacity="0.6"/>
  
  <!-- Whiskers -->
  <line x1="26" y1="52" x2="34" y2="53" stroke="#D4A373" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="26" y1="56" x2="33" y2="56" stroke="#D4A373" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="66" y1="53" x2="74" y2="52" stroke="#D4A373" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="67" y1="56" x2="74" y2="56" stroke="#D4A373" stroke-width="1.2" stroke-linecap="round"/>
</svg>
