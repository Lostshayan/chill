  <!-- Blush Cheeks -->
  <ellipse cx="30" cy="57" rx="4.5" ry="2.6" fill="#FFAAA6" opacity="0.6"/>
  <ellipse cx="70" cy="57" rx="4.5" ry="2.6" fill="#FFAAA6" opacity="0.6"/>
  
