<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cozy Lo-Fi Study Room - Sync & Chill</title>
  
  <!-- Modern Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Core Styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Retro Television Housing Set -->
  <div id="tv-set">
    <div class="tv-screen-bezel">
      <!-- Ambient Room Background (CRT Screen) -->
      <div class="room-container" id="roomContainer">


    <!-- SCENE 2: Winter Cabin -->
    <div id="scene2-container" class="scene-container" style="display: block; position: absolute; top: 0; left: 0; width: 100%; height: 100%;">
      <div id="bg-mountains" style="z-index: 1; position: absolute; width: 100%; height: 100%; background-size: cover; background-position: center;"></div>
      <canvas id="blizzard-canvas" style="z-index: 2; position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;"></canvas>
      
      <!-- Stacked foreground layers for lamp crossfade -->
      <div id="foreground-cabin-off" class="scene2-fg-layer" style="z-index: 3; opacity: 1;"></div>
      <div id="foreground-cabin-on" class="scene2-fg-layer" style="z-index: 3; opacity: 0;"></div>
      
      <!-- Hotspots -->
      <div class="hotspot-ring lamp" id="hotspotLamp2" style="left: 15%; top: 58%; z-index: 20;" title="Toggle Desk Lamp">
        <div class="ring-pulse"></div>
      </div>
      <div class="hotspot-ring window" id="hotspotWindow2" style="left: 70%; top: 40%; z-index: 20;" title="Toggle Blizzard">
        <div class="ring-pulse"></div>
      </div>
    </div>

    <!-- SCENE 3: Greenhouse Sanctuary -->
    <div id="scene3-container" class="scene-container" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;">
      <div id="forest-sunny" class="scene-frame"></div>
      <div id="forest-rainy" class="scene-frame"></div>

      <!-- Rain Engine Canvas (drawing behind room interior) -->
      <canvas id="rain-canvas"></canvas>

      <!-- Programmatically green-cut transparent room interior -->
      <canvas id="room-foreground-layer"></canvas>


    </div>

    <!-- Cozy Ambient Lighting Overlay (covers all layers for unified coloring) -->
    <div class="campfire-glow" id="campfireGlow"></div>
    <div class="lamp-light" id="lampLight"></div>
    
    <!-- CRT Screen Overlay with scanlines and reflection -->
    <div class="crt-screen-overlay"></div>
  </div> <!-- closes room-container -->
  </div> <!-- closes tv-screen-bezel -->

  <!-- TV Control Panel Bezel (Bottom Panel) -->
  <div class="tv-control-panel">
    <!-- Speaker Grille (Left side) -->
    <div class="tv-speaker">
      <div class="grille-line"></div>
      <div class="grille-line"></div>
      <div class="grille-line"></div>
      <div class="grille-line"></div>
      <div class="grille-line"></div>
      <div class="grille-line"></div>
      <div class="grille-line"></div>
      <div class="grille-line"></div>
    </div>

    <!-- TV Controls Section (Middle) -->
    <div class="tv-knobs-group">
      <!-- LED Track Display Screen -->
      <div class="tv-screen-display">
        <div class="tv-led-text" id="trackTitle">Loading beats...</div>
        <div class="tv-led-subtext" id="trackArtist">Chill Station</div>
      </div>

      <!-- Physical Push Buttons (Prev, Play, Next) -->
      <div class="tv-push-buttons">
        <button class="tv-push-btn" id="btnPrev" title="Previous Track"><i class="fa-solid fa-backward"></i></button>
        <button class="tv-push-btn play-btn" id="btnPlay" title="Play / Pause"><i class="fa-solid fa-play"></i></button>
        <button class="tv-push-btn" id="btnNext" title="Next Track"><i class="fa-solid fa-forward"></i></button>
      </div>

      <!-- Volume Knob Dial -->
      <div class="tv-knob-container">
        <div class="tv-knob-label">VOL</div>
        <div class="tv-knob" id="tvVolumeKnob" style="transform: rotate(120deg);">
          <div class="knob-marker"></div>
        </div>
        <!-- Hidden slider for master volume state -->
        <input type="range" min="0" max="1" step="0.05" value="0.7" id="slider-master" style="display: none;">
      </div>
    </div>

    <!-- Right Side Controls (Knobs & Switches) -->
    <div class="tv-right-group">
      <!-- Channel Switcher Knob (Scene selection) -->
      <div class="tv-knob-container">
        <div class="tv-knob-label">CH</div>
        <div class="tv-knob" id="tvChannelKnob" style="transform: rotate(0deg);">
          <div class="knob-marker"></div>
        </div>
      </div>

      <!-- Weather Toggle Switch -->
      <div class="tv-switch-container">
        <div class="tv-switch-label">WEATHER</div>
        <div class="tv-toggle-switch" id="tvWeatherSwitch">
          <div class="switch-handle"></div>
        </div>
      </div>

      <!-- Glowing LED Power Indicator -->
      <div class="tv-led-indicator glow-red" id="tvPowerLed" title="Power Indicator"></div>

      <!-- Extra Bezel Buttons -->
      <div class="tv-buttons-extra">
        <button class="tv-small-btn" id="toggleLeftPanelBtn" title="Soundscape Layers & Vibes">
          <i class="fa-solid fa-sliders"></i>
        </button>
        <button class="tv-small-btn" id="toggleTodoBtn" title="Study Checklist">
          <i class="fa-solid fa-list-check"></i>
        </button>
      </div>
    </div>
  </div>
  </div> <!-- closes tv-set -->

  <!-- Digital Clock (Top Center) -->
  <div class="top-center-overlay">
    <div class="digital-clock" id="digitalClock">12:00 PM</div>
  </div>

  <!-- LEFT SLIDE-IN PANEL: Audio Mixer & Vibes -->
  <aside class="slide-panel slide-panel-left glass-panel" id="panelLeft">
    <div class="panel-header">
      <h2><i class="fa-solid fa-sliders"></i> Soundscape Mixer</h2>
      <div class="panel-header-actions">
        <button class="ctrl-btn" id="togglePlaylistBtn" title="Change Playlist Vibe"><i class="fa-solid fa-music"></i> Select Vibe</button>
        <button class="ctrl-btn" id="closePanelLeft" title="Close"><i class="fa-solid fa-xmark"></i></button>
      </div>
    </div>

    <!-- Theme Switcher -->
    <div class="theme-switcher-section">
      <h3 class="section-label"><i class="fa-solid fa-palette"></i> Room Theme</h3>
      <div class="theme-cards">
        <button class="theme-card active" data-theme="scene2" id="themeCardWinter">
          <span class="theme-card-icon">❄️</span>
          <span class="theme-card-label">Winter Cabin</span>
        </button>
        <button class="theme-card" data-theme="scene3" id="themeCardForest">
          <span class="theme-card-icon">🌿</span>
          <span class="theme-card-label">Greenhouse</span>
        </button>
      </div>
    </div>

    <!-- Soundscape Mixer -->
    <div class="mixer-section">
      <div class="mixer-item">
        <div class="mixer-label">
          <span><i class="fa-solid fa-cloud-showers-heavy"></i> Rain & Storm</span>
          <span class="value" id="val-rain">Off</span>
        </div>
        <input type="range" min="0" max="1" step="0.05" value="0" class="slider" id="slider-rain">
      </div>

      <div class="mixer-item">
        <div class="mixer-label">
          <span><i class="fa-solid fa-fire"></i> Cozy Campfire</span>
          <span class="value" id="val-campfire">Off</span>
        </div>
        <input type="range" min="0" max="1" step="0.05" value="0" class="slider" id="slider-campfire">
      </div>

      <div class="mixer-item">
        <div class="mixer-label">
          <span><i class="fa-solid fa-keyboard"></i> Keyboard Clicks</span>
          <span class="value" id="val-keyboard">Off</span>
        </div>
        <input type="range" min="0" max="1" step="0.05" value="0" class="slider" id="slider-keyboard">
      </div>

      <div class="mixer-item">
        <div class="mixer-label">
          <span><i class="fa-solid fa-mug-hot"></i> Coffee Shop Ambient</span>
          <span class="value" id="val-cafe">Off</span>
        </div>
        <input type="range" min="0" max="1" step="0.05" value="0" class="slider" id="slider-cafe">
      </div>

      <div class="mixer-item">
        <div class="mixer-label">
          <span><i class="fa-solid fa-wind"></i> Autumn Wind</span>
          <span class="value" id="val-wind">Off</span>
        </div>
        <input type="range" min="0" max="1" step="0.05" value="0" class="slider" id="slider-wind">
      </div>
    </div>

    <!-- Playlist sub-drawer inside left panel -->
    <div class="playlist-drawer" id="playlistDrawer">
      <div class="playlist-drawer-header">
        <h3><i class="fa-solid fa-compact-disc"></i> Select Vibe</h3>
        <button class="ctrl-btn" id="closePlaylistBtn" title="Close"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="playlist-drawer-items">
        <button class="vibe-btn active" data-vibe="focus">
          <i class="fa-solid fa-brain"></i> Focus Beats
        </button>
        <button class="vibe-btn" data-vibe="cafe">
          <i class="fa-solid fa-coffee"></i> Cozy Cafe
        </button>
        <button class="vibe-btn" data-vibe="dream">
          <i class="fa-solid fa-moon"></i> Sleepy Dreams
        </button>
        <button class="vibe-btn" data-vibe="jazz">
          <i class="fa-solid fa-guitar"></i> Midnight Jazz
        </button>
      </div>
    </div>
  </aside>

  <!-- RIGHT SLIDE-IN PANEL: Room Lobby (Removed for now) -->

  <!-- SHARED TO-DO LIST MODAL (Triggered by Laptop Hotspot) -->
  <div class="modal-overlay" id="todoModal">
    <div class="modal-content glass-panel">
      <div class="modal-header">
        <h3><i class="fa-solid fa-list-check"></i> Shared Room Study Checklist</h3>
        <button class="close-modal-btn" id="closeTodoBtn"><i class="fa-solid fa-times"></i></button>
      </div>
      <div class="modal-body">
        <form class="todo-input-form" id="todoForm">
          <input type="text" id="todoInput" placeholder="Add a task to study together..." required>
          <button type="submit"><i class="fa-solid fa-plus"></i> Add</button>
        </form>
        <ul class="todo-list" id="todoList">
          <!-- Populated dynamically -->
        </ul>
      </div>
    </div>
  </div>



  <script src="config.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
